name: Publish verified Dreminex updates
on:
  push:
    branches: [main]
    paths: ['release-input/**','latest.json','.github/workflows/publish-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate combined manifest and assets
        id: release
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; d=json.load(open("latest.json")); print("dreminex-suite-v%s-nexus-v%s"%(d["plugin"]["version"],d["android"]["version"]))')
          dir="release-input/$tag"; test -d "$dir"; (cd "$dir" && sha256sum --check SHA256SUMS.txt)
          python3 - "$dir" <<'PY'
          import hashlib,json,pathlib,re,sys,zipfile
          d=json.load(open('latest.json')); root=pathlib.Path(sys.argv[1])
          plugin_version=d['plugin']['version']; android_version=d['android']['version']
          expected={'plugin':root/f'Dreminex_Suite_v{plugin_version}.zip','android':root/f'Dreminex_Nexus_v{android_version}_signed.apk'}
          assert sorted(p.name for p in root.iterdir()) == sorted([expected['plugin'].name,expected['android'].name,'RELEASE_NOTES.md','SHA256SUMS.txt'])
          prefix='https://github.com/anime68/codex-cloud-dreminex-admin-plugin-and-nexus-app-release/releases/download/'
          for key,path in expected.items():
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==d[key]['sha256']
              assert d[key]['download_url'].startswith(prefix) and d[key]['download_url'].endswith('/'+path.name)
          with zipfile.ZipFile(expected['plugin']) as archive:
              names=archive.namelist(); assert names and all(name.startswith('dreminex-suite/') for name in names)
              main=archive.read('dreminex-suite/dreminex-suite.php').decode('utf-8')
              assert re.search(r'Version:\s*'+re.escape(plugin_version)+r'\b',main)
              assert re.search(r"define\(\s*['\"]DREMINEX_SUITE_VERSION['\"]\s*,\s*['\"]"+re.escape(plugin_version)+r"['\"]",main)
          PY
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Publish immutable combined release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"; dir="${{ steps.release.outputs.dir }}"
          plugin_version=$(python3 -c 'import json; print(json.load(open("latest.json"))["plugin"]["version"])')
          android_version=$(python3 -c 'import json; print(json.load(open("latest.json"))["android"]["version"])')
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release already exists; assets remain immutable."; else gh release create "$tag" --target "$GITHUB_SHA" --title "Dreminex Suite $plugin_version · Nexus $android_version" --notes-file "$dir/RELEASE_NOTES.md" "$dir"/*.zip "$dir"/*.apk "$dir/SHA256SUMS.txt"; fi
      - name: Validate public URLs
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request
          d=json.load(open('latest.json'))
          for key in ('plugin','android'):
              with urllib.request.urlopen(d[key]['download_url'],timeout=60) as r:
                  assert r.status==200
                  assert hashlib.sha256(r.read()).hexdigest()==d[key]['sha256']
          print('Combined public update channel: PASS')
          PY
